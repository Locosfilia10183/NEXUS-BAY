name: Deploy NEXUS-BAY World Map

on:
  push:
    branches:
      - forge-development
    paths:
      - "world-map/**"
      - ".github/workflows/deploy-world-map.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload map site
        uses: actions/upload-pages-artifact@v3
        with:
          path: world-map
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
