# NEXUS-BAY Core Configuration
# ============================

settings:
  island-spacing: 320
  island-radius: 42
  starting-coins: 250
  xp-per-level: 100

# Database (Phase 1)
# When enabled=true the plugin will use MariaDB instead of YAML.
# Credentials should be loaded from /opt/nexus-bay/config/secrets.env in production.
database:
  enabled: false
  host: localhost
  port: 3306
  name: nexusbay
  user: nexusbay
  password: ""
  pool-size: 10

spawn:
  world: world
  x: 0.5
  y: 100
  z: 0.5

# Runtime data (YAML fallback when database.enabled = false)
islands: {}
players: {}
