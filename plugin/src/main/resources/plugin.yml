name: NexusBay
version: '1.2.2-bounty'
main: de.nexusbay.core.NexusBay
api-version: '1.21'
authors: [NEXUS-BAY]
description: Core RPG, bounty quests, islands and admin for NEXUS-BAY
website: https://github.com/Locosfilia10183/NEXUS-BAY

commands:
  bayadmin:
    description: Administration panel
    permission: nexusbay.admin
  bayisland:
    description: Island management
    usage: /bayisland <create|visit|list> [name]
  bayprofile:
    description: Pirate profile
  baypay:
    description: Send Bay-Coins
    usage: /baypay <player> <amount>
  bayinv:
    description: Inventory inspection
    permission: nexusbay.admin
  baycrew:
    description: Crew system
    usage: /baycrew <create|invite|accept|leave|deposit|info>
  bayskill:
    description: Skill trees
    usage: /bayskill list <tree> | unlock <tree> <node>
  bayquest:
    description: Kopfgeld / Logbuch
    usage: /bayquest list | status | accept | abandon

permissions:
  nexusbay.admin:
    description: Full administration
    default: op
  nexusbay.player:
    description: Basic player access
    default: true
