name: NexusBay
version: '${project.version}'
main: de.nexusbay.core.NexusBay
api-version: '1.21'
authors: [NEXUS-BAY]
description: Core RPG, islands, economy and admin systems for the NEXUS-BAY pirate network
website: https://github.com/Locosfilia10183/NEXUS-BAY

commands:
  bayadmin:
    description: Opens the NEXUS-BAY administration panel
    permission: nexusbay.admin
    usage: /bayadmin
  bayisland:
    description: Creates and manages islands
    usage: /bayisland <create|visit|list> [name]
  bayprofile:
    description: Shows your pirate profile (level, XP, coins)
    usage: /bayprofile
  baypay:
    description: Sends Bay-Coins to another player
    usage: /baypay <player> <amount>
  bayinv:
    description: Read-only inventory inspection
    usage: /bayinv <player>
    permission: nexusbay.admin

permissions:
  nexusbay.admin:
    description: Full administration access
    default: op
  nexusbay.player:
    description: Basic player access
    default: true
