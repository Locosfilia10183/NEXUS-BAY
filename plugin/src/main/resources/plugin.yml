name: NexusBay
version: '1.3.0-harbor-admin'
main: de.nexusbay.core.NexusBay
api-version: '1.21'
authors: [NEXUS-BAY]
description: Pirate RPG core – harbor spawn, modern admin GUI, bounty quests
website: https://github.com/Locosfilia10183/NEXUS-BAY

commands:
  bayadmin:
    description: Modern multi-page admin menu (Java)
    permission: nexusbay.admin
  bayspawn:
    description: Build large harbor spawn at your position
    usage: /bayspawn build
    permission: nexusbay.admin
  bayisland:
    description: Island management
    usage: /bayisland <create|visit|list> [name]
  bayprofile:
    description: Pirate profile
  baypay:
    description: Send Bay-Coins
    usage: /baypay <player> <amount>
  bayinv:
    description: Inventory inspection
    permission: nexusbay.admin
  baycrew:
    description: Crew system
  bayskill:
    description: Skill trees
  bayquest:
    description: Bounty / logbook
    usage: /bayquest list | status | accept | abandon

permissions:
  nexusbay.admin:
    description: Full administration (GUI + spawn build)
    default: op
  nexusbay.player:
    default: true
